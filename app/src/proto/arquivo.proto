syntax = "proto3";
package filepriv;

message ServidorCandidato {
  int32 id = 1;
  string host = 2;
  int32 porta = 3;
  int32 arquivos_armazenados = 4;
}

// ---- Destinos de armazenamento ----

message DestinoVmParaUpload {
  repeated ServidorCandidato servidores_disponiveis = 1; // Rust escolhe o menos carregado
  string usuario_ssh = 2;
  string chave_privada_referencia = 3;
  string diretorio_remoto = 4;
}

message DestinoVmEspecifico {
  string host = 1;
  int32 porta = 2;
  string usuario_ssh = 3;
  string chave_privada_referencia = 4;
  string diretorio_remoto = 5;
}

message DestinoS3Externo {
  string bucket = 1;
  string credencial_referencia = 2; // referência no cofre S3 da aplicação — nunca AK/SK em texto puro
  string regiao = 3;                // vazio = Rust usa us-east-1 como default
}

message MetadadosUpload {
  int32 usuario_id = 1;
  string nome_arquivo = 2;
  string tipo_arquivo = 3;
  oneof destino {
    DestinoVmParaUpload vm = 4;
    DestinoS3Externo s3_externo = 5;
  }
}

message ArquivoChunkUpload {
  oneof conteudo {
    MetadadosUpload metadados = 1;
    bytes pedaco = 2;
  }
}

message RespostaUpload {
  bool sucesso = 1;
  string mensagem_erro = 2;
  string chave_referencia = 3;
  int32 servidor_id = 4;                        // > 0 só quando o destino foi uma VM
  int32 tamanho = 5;
  string hash = 6;
  string nome_remoto = 7;
  bool armazenado_em_provedor_externo = 8;       // true quando foi salvo no S3 do próprio usuário
}

message SalvarCredencialSshRequest {
  bytes chave_privada = 1;
}

message SalvarCredencialSshResponse {
  bool sucesso = 1;
  string mensagem_erro = 2;
  string chave_privada_referencia = 3;
}

// ---- NOVO: conexão com o S3 do próprio usuário ----

message ConectarProvedorS3Request {
  string bucket = 1;
  string access_key = 2;
  string secret_key = 3;
  string regiao = 4; // vazio = Rust usa us-east-1 como default
}

message ConectarProvedorS3Response {
  bool sucesso = 1;
  string mensagem_erro = 2;
  string credencial_referencia = 3;
  string regiao_usada = 4; // a informada, ou us-east-1 se ficou vazia
}

message ServidorParaVerificar {
  string host = 1;
  int32 porta = 2;
}

enum StatusVerificacao {
  ATIVO = 0;
  ERRO = 1;
  SEM_RESPOSTA = 2;
}

message ResultadoVerificacao {
  string host = 1;
  int32 porta = 2;
  StatusVerificacao status = 3;
  string detalhe = 4;
}

// VerificarServidores permanece exclusivo de VM — não se aplica a
// provedores externos (sem healthcheck automático contra a conta do usuário).
message VerificarServidoresRequest {
  repeated ServidorParaVerificar servidores = 1;
  string usuario_ssh = 2;
  string chave_privada_referencia = 3;
  string diretorio_remoto = 4;
}

message VerificarServidoresResponse {
  repeated ResultadoVerificacao resultados = 1;
}

message SolicitacaoDownload {
  string nome_remoto = 1;
  string chave_referencia = 2;
  oneof destino {
    DestinoVmEspecifico vm = 3;
    DestinoS3Externo s3_externo = 4;
  }
}

message PedacoArquivo {
  bytes pedaco = 1;
}

message SolicitacaoExclusao {
  string nome_remoto = 1;
  string chave_referencia = 2;
  oneof destino {
    DestinoVmEspecifico vm = 3;
    DestinoS3Externo s3_externo = 4;
  }
}

message RespostaExclusao {
  bool sucesso = 1;
  string mensagem_erro = 2;
}

service ProcessadorArquivo {
  rpc EnviarArquivo(stream ArquivoChunkUpload) returns (RespostaUpload);
  rpc VerificarServidores(VerificarServidoresRequest) returns (VerificarServidoresResponse);
  rpc BaixarArquivo(SolicitacaoDownload) returns (stream PedacoArquivo);
  rpc ExcluirArquivo(SolicitacaoExclusao) returns (RespostaExclusao);
  rpc SalvarCredencialSsh(SalvarCredencialSshRequest) returns (SalvarCredencialSshResponse);
  rpc ConectarProvedorS3(ConectarProvedorS3Request) returns (ConectarProvedorS3Response); // NOVO
}