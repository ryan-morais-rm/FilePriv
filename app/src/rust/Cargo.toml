[package]
name = "filepriv-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
tonic = "0.11"
prost = "0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
aes-gcm = "0.10"
ssh2 = "0.9"

[build-dependencies]
tonic-build = "0.11"