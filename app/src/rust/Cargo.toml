[package]
name = "filepriv-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
tonic = { version = "0.11", features = ["tls"] }
prost = "0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-stream = "0.1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
aes-gcm = "0.10"
ssh2 = "0.9"
aws-config = "1"
aws-sdk-s3 = "1"
aws-credential-types = "1"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tonic-build = "0.11"